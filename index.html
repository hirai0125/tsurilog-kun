<!DOCTYPE html>
<html lang="ja">
<head>

<title>釣りログ君</title>
<style>
:root{--bg:#f2f6f8;--card:#fff;--ink:#17323f;--sub:#5f7682;--main:#0b4f6c;--acc:#f28c28;--line:#d7e2e8;--ok:#1f8a5b;--ng:#c0392b;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:84px}
header{background:var(--main);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.05em}
.hbtn{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;cursor:pointer}
header small{opacity:.8;font-size:12px}
main{max-width:720px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;line-height:1}
nav button.on{color:var(--main);font-weight:700}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--main);border-left:4px solid var(--acc);padding-left:8px}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
input,select,textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:70px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;background:var(--main);color:#fff;cursor:pointer}
.btn.sub{background:#e4edf2;color:var(--main)}
.btn.acc{background:var(--acc)}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.chip .x{margin-left:6px;opacity:.6}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:space-between;background:#fbfdfe}
.tile.has{background:#fff4e8;border-color:#f6c38f}
.tile .nm{font-weight:700;font-size:15px}
.tile .ct{font-size:22px;font-weight:800;color:var(--acc);min-width:30px;text-align:center}
.pm{width:38px;height:38px;border-radius:50%;border:0;font-size:22px;font-weight:700;background:#e4edf2;color:var(--main)}
.pm.plus{background:var(--main);color:#fff}
.trip{cursor:pointer}
.trip .top{display:flex;justify-content:space-between;align-items:baseline}
.trip .dt{font-weight:800;font-size:16px}
.trip .pl{color:var(--sub);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.tag{font-size:12px;background:#e8f1f5;color:var(--main);border-radius:6px;padding:2px 7px}
.tag.o{background:#fff1e3;color:#a95c0d}
.big{font-size:26px;font-weight:800;color:var(--acc)}
.muted{color:var(--sub);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--sub);font-weight:600}
td.n,th.n{text-align:right}
.bar{height:10px;background:var(--acc);border-radius:5px;min-width:2px}
.det{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#17323f;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:720px;padding:16px;max-height:90vh;overflow:auto}
.sticky-save{position:sticky;bottom:72px;display:flex;gap:8px;margin-top:8px}
.sticky-save .btn{flex:1;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.warn{background:#fff6e0;border:1px solid #f1d38a;border-radius:8px;padding:8px;font-size:13px;margin-bottom:10px}
.ptable{font-size:13px}
.ptable th,.ptable td{border:1px solid #9fb3bd;padding:4px 5px;vertical-align:top}
.ptable th{background:#e8f1f5;color:#17323f;text-align:center;white-space:nowrap}
.ptable td.nw{white-space:nowrap}

.pwrap{overflow-x:auto}.pinner{width:1040px}.ptable{min-width:680px}
.pblock{width:100%}
@media screen{.pblock[data-trip]{cursor:pointer}.pblock[data-trip]:active{outline:2px solid var(--acc)}}.pblock th,.pblock td{white-space:nowrap;overflow:hidden}
.ptl{white-space:nowrap;overflow:hidden}

.pblock .c0{width:110px}.pblock .c1{width:110px}.pblock .cf{width:44px;text-align:center}.pblock .ca{width:58px;text-align:center}.pblock .cm{width:110px}

.pblock tr.pp th{background:#fff;text-align:left;font-size:14px;border-bottom:0;padding:4px 6px}
.pblock tr.me td{background:#ffe6c7;border-top:2px solid #f0a050;border-bottom:2px solid #f0a050}
.pblock tr.me td.c0{font-weight:800;border-left:5px solid #e8590c}
.pblock tr.me td.cf b{font-size:17px}
.mybadge{display:inline-flex;align-items:center;gap:5px;margin-left:12px;background:#fff0dd;border:2px solid #e8590c;border-radius:16px;padding:1px 10px 1px 2px;font-size:13px;color:#7a3300;vertical-align:middle}
.mybadge b{font-size:17px;color:#d0021b}.mybadge .face{display:inline-block}
.pblock tr.me td.cf,.pblock tr.me td.ca{color:#d0021b;font-weight:700}
tr.ysep td{border-top:2.5px solid #6f8794}
.my,.my b{color:#d0021b!important;font-weight:700}
@media print{.my,.my b{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.pblock tr.pf td{background:#f3f6f8;font-size:12px}
.ptide{font-size:12px;color:#17323f;margin:-12px 0 14px;padding:3px 6px;border:1px solid #9fb3bd;border-top:0}
.pyr{border-left:6px solid var(--yc);padding-left:8px;margin-bottom:18px}
.pyear{background:var(--yc);color:#fff;font-weight:800;font-size:15px;padding:5px 10px;margin:0 0 8px -8px;border-radius:0 6px 6px 0}
.pyear span{font-weight:400;font-size:13px;margin-left:16px}
.pyr .pblock tr.ph th{background:color-mix(in srgb, var(--yc) 14%, white)}
.ptitle{font-size:18px;font-weight:800;margin:0 0 4px}
.rcard{border:3px solid var(--main);padding:0;overflow:hidden}
.rcard>.pwrap,.rcard>.empty,.rcard>.muted:not(.pcond){margin-left:12px;margin-right:12px}
.rcard>.pwrap{padding-top:12px}.rcard>.muted:last-child{margin-bottom:12px}
.rhead{background:var(--main);color:#fff;padding:12px 14px 14px}
.rhead .rt{font-size:22px;font-weight:800;letter-spacing:.05em}
.rhead .rc{font-size:12px;opacity:.85;margin-top:2px}
.rstat{display:flex;gap:8px;margin-top:10px}
.rstat>div{flex:1;background:rgba(255,255,255,.14);border-radius:10px;padding:6px 4px;text-align:center}
.rstat b{display:block;font-size:24px;line-height:1.1;color:#ffd27a}
.rstat span{font-size:11px;opacity:.9}
@media screen{.rcard .ptitle,.rcard .pcond{display:none}}
@media print{.rcard{border:0}.rcard>.pwrap,.rcard>.muted{margin:0}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;padding:0;font-size:11pt}
  header,nav,.no-print,.toast{display:none!important}
  main{max-width:none;padding:0}
  .card{box-shadow:none;padding:0;border-radius:0}
  .ptable{min-width:0}
  .pwrap{overflow:visible}
  .ptable tr{page-break-inside:avoid}
  .pblock{page-break-inside:avoid;break-inside:avoid}
  .pyear{break-after:avoid;page-break-after:avoid}
  .pyr,.pyear,.pyr .pblock tr.ph th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pblock tr.me td,.pblock tr.ph th,.pblock tr.pf td,.mybadge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pblock tr.me td.cf,.pblock tr.me td.ca,.pblock tr.me td.cf b,.pblock tr.me td.ca b{color:#d0021b!important}
  .ptable thead{display:table-header-group}
}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#e4edf2}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.photos .ph button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px}
.thumbs{display:flex;gap:4px;margin-top:6px}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#e4edf2}
.pphotos{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid #9fb3bd;border-top:0;margin:-14px 0 14px}
.pphotos img{height:150px;max-width:220px;object-fit:contain;border-radius:4px}
@media print{.ptide{page-break-inside:avoid;break-inside:avoid}.pphotos{page-break-inside:avoid;break-inside:avoid}}
.face{display:block}
.modal .bounce .face{margin:0 auto}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cpick{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:1.3;color:var(--ink);cursor:pointer;font-family:inherit}
.cpick.on{border-color:var(--acc);background:#fff4e8;box-shadow:0 0 0 2px #f6c38f}
.cpick small{color:var(--sub)}
.cprev{display:flex;justify-content:space-between;gap:4px;text-align:center}.cprev small{font-size:11px;color:var(--sub);line-height:1.3;display:block}.cprev .face{margin:0 auto}
.mood{display:flex;align-items:center;gap:14px;background:#f6fafc;border-radius:12px;padding:10px;margin-bottom:12px}
.mood .n{font-size:34px;font-weight:800;color:var(--acc);line-height:1}.mood .n small{font-size:15px}
.mood .m{font-size:16px;font-weight:800;margin-top:4px}
.bounce{animation:bn .5s ease}@keyframes bn{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bounce{animation:none}}
.stepnav{position:sticky;top:50px;z-index:4;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;margin:-4px 0 6px;scrollbar-width:none}
.stepnav::-webkit-scrollbar{display:none}
.stepnav a{flex:none;text-decoration:none;font-size:13px;font-weight:700;color:var(--main);background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 11px}
.stepnav a.done{background:#e6f4ec;border-color:#9fd3b4;color:#1d6b3f}
.card h2.st{display:flex;align-items:center;gap:8px;border:0;padding:0;font-size:17px}
.st .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-size:15px}
.st .tg{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:#e4edf2;color:var(--sub)}
.st .tg.req{background:#fde6dc;color:#c0392b}
.hint{font-size:13px;color:var(--sub);background:#f3f8fa;border-radius:8px;padding:7px 10px;margin:-2px 0 10px}
.card[id^=st]{scroll-margin-top:104px}
details.seatbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
details.seatbox summary{font-weight:700;font-size:14px;color:var(--main);cursor:pointer}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.who .chip{font-size:15px;padding:8px 14px}
.sticky-save .mini{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:4px 10px 4px 4px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-weight:800;color:var(--acc)}
.trip .face{display:inline-block;vertical-align:middle;flex:none}
.mybox{display:flex;align-items:center;gap:10px;background:#fff0dd;border:2px solid #f0a050;border-left:6px solid #e8590c;border-radius:10px;padding:6px 10px;margin:8px 0 6px}
.mybox .mn{font-weight:800;font-size:15px;color:#7a3300}.mybox .mn b{font-size:24px;color:#d0021b;margin:0 2px}
</style>
</head>
<body>
<header><h1>🎣 釣りログ君</h1><div style="display:flex;align-items:center;gap:10px"><small id="hdrSub"></small><button id="hdrPrint" class="hbtn">🖨 印刷</button></div></header>
<main id="app"></main>
<nav>
  <button data-nav="print" class="on"><b>🎣</b>釣果記録</button>
  <button data-nav="list"><b>📋</b>記録一覧</button>
  <button data-nav="stats"><b>📊</b>集計</button>
  <button data-nav="settings"><b>⚙️</b>設定</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="dataFile" accept=".json,application/json,text/plain" style="display:none">
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
const KEY = 'tsuribori-note-share-v1';
const DEF_FISH = ['ブリ','メジロ','ハマチ','ブリヒラ','ヒラマサ','カンパチ','シオ','マダイ','シマアジ','イサキ','マハタ','クロソイ','サーモン','タマクエ'];
const DEF_BAIT = ['生きアジ','ウグイ','シラサエビ','キビナゴ','イワシ','サバ切り身','ササミ','AKB','イカ','ハイブリッドクロス','ダンゴ'];
const OLD_BAIT = ['活きアジ','イワシ','キビナゴ','ササミ','エビ','ダンゴ','イカ','サバ切り身','練りエサ'];
const DEF_PLACE = ['釣堀紀州','雑賀崎シーパーク','釣堀田尻','釣堀オーパ','辨屋','水宝','レインボー'];
const STATIONS = [['','（なし）'],
  ['SR','白浜（和歌山県）'],['GB','御坊（和歌山県）'],['YR','由良推定（御坊と下津の平均）'],['H1','下津（和歌山県）'],['Z9','海南（和歌山県）'],['WY','和歌山（和歌山市）'],
  ['TB','鳥羽（三重県）'],['K1','姫路・飾磨（兵庫県）'],['XM','敦賀（福井県）'],
  ['TN','淡輪（大阪府）'],['KK','関空島（大阪府）'],['J2','岸和田（大阪府）'],['IO','泉大津（大阪府）'],['SI','堺（大阪府）'],['OS','大阪（大阪府）']];
const stnName = c => (STATIONS.find(x=>x[0]===c)||[c,c])[1].replace(/（.*）/,'');
const DEF_TIDE_STN = {'辨屋':'TB','水宝':'K1','レインボー':'XM','釣堀紀州':'YR','雑賀崎シーパーク':'WY','釣堀オーパ':'OS','釣堀田尻':'OS'};
const DEF_PEOPLE = [];
const TIDES = ['大潮','中潮','小潮','長潮','若潮'];
const FLOW_SPEED = ['','止まっている','緩い','普通','やや速い','速い','激流'];
const FLOW_DIR = ['','北','北東','東','南東','南','南西','西','北西','回っている／変わる'];
const WEATHER = ['','晴れ','晴れ時々曇り','曇り','曇りのち雨','小雨','雨'];
const WIND_DIR = ['','北','北東','東','南東','南','南西','西','北西','無風'];
const WIND_POW = ['','無風','弱い','やや弱い','普通','やや強い','強い','強風'];
function windParts(t){ // 旧データ（文字入力）からも風向・強さを読み取る
  if(t.windDir!=null || t.windPow!=null) return [t.windDir||'', t.windPow||''];
  const w=String(t.wind||'').trim().split(/[\s　・]+/);
  const d=WIND_DIR.includes(w[0])?w[0]:'', p=WIND_POW.includes(w[w.length-1])&&w[w.length-1]!==d?w[w.length-1]:'';
  return [d,p];
}

let storageOK = true;
let db = load();
let view = 'print'; // 最初に開く画面：海上釣堀 釣果記録
let draft = null;          // 編集中の釣行
let curPerson = null;      // 釣果入力中の人
let lastLv = null;         // 直前の表情（変わった時だけ弾ませる）
let delArm = false;
let filt = {year:'all', place:'all'};

/* ---------- 保存 ---------- */
function normalize(d){
  d = d || {};
  d.trips = Array.isArray(d.trips) ? d.trips : [];
  d.fish = Array.isArray(d.fish) && d.fish.length ? d.fish : DEF_FISH.slice();
  d.places = Array.isArray(d.places) ? d.places : DEF_PLACE.slice();
  d.people = Array.isArray(d.people) ? d.people : DEF_PEOPLE.slice();
  d.baits = Array.isArray(d.baits) ? d.baits : DEF_BAIT.slice();
  d.tideStn = (d.tideStn && typeof d.tideStn==='object') ? d.tideStn : {...DEF_TIDE_STN};
  d.trips.forEach(t=>{ if(!Array.isArray(t.baits)) t.baits=[]; t.seats=t.seats||{}; t.pnotes=t.pnotes||{}; if(!Array.isArray(t.photos)) t.photos=[];
    if(t.ikada && !t.seats[d.me]) t.seats[d.me]=t.ikada;
    if(!t.rafts){ t.rafts={}; // 旧データ「紀州A-東南」→ イカダ名「紀州A」＋番号・方位「東南」
      for(const p in t.seats){ const v=String(t.seats[p]||''); let m=v.match(/^(.+?)-(.+)$/) || v.match(/^(\D+?)(\d.*)$/);
        if(m){ t.rafts[p]=m[1]; t.seats[p]=m[2]; } } } });
  d.me = d.me || '自分';
  if(!(d.addV>=2)){ d.trips.forEach(t=>{ // 天気の「強風」→ 風の強さへ
      if(t.weather==='強風'){ t.weather=''; const [wd,wp]=windParts(t); t.windDir=wd; t.windPow=wp||'強風'; t.wind=[t.windDir,t.windPow].filter(Boolean).join(' '); }
      if(t.windPow==='非常に強い'){ t.windPow='強風'; t.wind=[t.windDir,t.windPow].filter(Boolean).join(' '); } }); }
  if(!(d.addV>=1)){ for(const p of ['辨屋','水宝']){ if(!d.places.includes(p)) d.places.push(p); if(!d.tideStn[p]) d.tideStn[p]=DEF_TIDE_STN[p]; } d.addV=1; }
  if(!(d.addV>=3)){ if(!d.places.includes('レインボー')) d.places.push('レインボー'); if(!d.tideStn['レインボー']) d.tideStn['レインボー']='XM'; d.addV=3; }
  return d;
}
function load(){
  try{ const s = localStorage.getItem(KEY); if(s) return normalize(JSON.parse(s)); }
  catch(e){ storageOK = false; }
  return normalize({});
}
const listsSig = d => JSON.stringify([d.fish,d.baits,d.places,d.people,d.me,d.tideStn]);
let lastListsSig = null;
function save(){
  setMeta({changedAt:Date.now()});
  const sig = listsSig(db); if(lastListsSig!==null && sig!==lastListsSig) db.listsAt = Date.now(); lastListsSig = sig;
  try{ localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
  catch(e){ storageOK = false; toast('この画面では保存できません。設定→バックアップで書き出してください'); }
}

/* ---------- 写真（端末内の IndexedDB に保存） ---------- */
const photoCache = {};
let idbP = null;
function idb(){
  if(!idbP) idbP = new Promise((res,rej)=>{
    try{ const r=indexedDB.open('tsuribori-note-share-photos',1);

function shrinkImage(file, max=1400, q=0.78){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ let w=im.naturalWidth,h=im.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);

function mergeDb(L, R){
  if(!R || !Array.isArray(R.trips)) return L;
  const del = {...(R.deleted||{})};
  for(const k in (L.deleted||{})) del[k] = Math.max(del[k]||0, L.deleted[k]);
  const map = {};
  for(const t of [...R.trips, ...L.trips]){ const o=map[t.id]; if(!o || (t.updatedAt||0) > (o.updatedAt||0)) map[t.id]=t; }
  const trips = Object.values(map).filter(t => !(del[t.id] && del[t.id] >= (t.updatedAt||0)));
  const lw = (L.listsAt||0) >= (R.listsAt||0) ? L : R;
  const out = JSON.parse(JSON.stringify({...lw, trips:[], deleted:{}}));
  out.trips = JSON.parse(JSON.stringify(trips)); out.deleted = del;
  delete out.photoData;
  return normalize(out);
}

/* 月齢と潮名（目安）— 新月時刻は Meeus の計算式（主要補正項）で求める */
function newMoonJDE(k){
  const T=k/1236.85, rad=Math.PI/180;
  let jde=2451550.09766+29.530588861*k+0.00015437*T*T;
  const E=1-0.002516*T, M=(2.5534+29.1053567*k)*rad, Mp=(201.5643+385.81693528*k+0.0107582*T*T)*rad;
  const F=(160.7108+390.67050284*k)*rad, Om=(124.7746-1.56375588*k)*rad;
  jde+=-0.40720*Math.sin(Mp)+0.17241*E*Math.sin(M)+0.01608*Math.sin(2*Mp)+0.01039*Math.sin(2*F)
      +0.00739*E*Math.sin(Mp-M)-0.00514*E*Math.sin(Mp+M)+0.00208*E*E*Math.sin(2*M)-0.00111*Math.sin(Mp-2*F)
      -0.00057*Math.sin(Mp+2*F)+0.00056*E*Math.sin(2*Mp+M)-0.00042*Math.sin(3*Mp)+0.00042*E*Math.sin(M+2*F)
      +0.00038*E*Math.sin(M-2*F)-0.00024*E*Math.sin(2*Mp-M)-0.00017*Math.sin(Om);
  return jde;
}
const jdToMs = jd => (jd-2440587.5)*86400000;
function lastNewMoon(ms){ // ms 以前で直近の新月時刻（UTCミリ秒）
  const jd = ms/86400000+2440587.5;
  let k = Math.floor((jd-2451550.09766)/29.530588861)+1;
  while(jdToMs(newMoonJDE(k))>ms) k--;
  return jdToMs(newMoonJDE(k));
}
function moonAge(ds){
  const [y,m,d]=ds.split('-').map(Number);
  const noon=Date.UTC(y,m-1,d,3,0); // 日本時間 正午
  return (noon-lastNewMoon(noon))/86400000;
}
function kyuurekiDay(ds){ // 旧暦日の目安：新月の日（日本時間）を1日とする
  const [y,m,d]=ds.split('-').map(Number);
  const endOfDay=Date.UTC(y,m-1,d,15,0)-1; // 日本時間 23:59
  const nm=lastNewMoon(endOfDay)+9*3600000;
  const nmDay=Math.floor(nm/86400000), day=Math.floor((Date.UTC(y,m-1,d))/86400000);
  return day-nmDay+1;
}

  if(day<=3 || day>=30) return '大潮';

  if(day<=9) return '小潮';
  if(day===10) return '長潮';
  if(day===11) return '若潮';
  if(day<=14) return '中潮';
  if(day<=17) return '大潮';
  if(day<=21) return '中潮';
  if(day<=24) return '小潮';
  if(day===25) return '長潮';
  if(day===26) return '若潮';
  return '中潮';
}

function tideNodal(N){

    M2K1:[fM2*fK1,uM2+uK1],M2O1:[fM2*fO1,uM2+uO1],M2K2:[fM2*fK2,uM2+uK2],M3:[fM2**1.5,1.5*uM2],'M2^2':[fM2**2,2*uM2],'M2^3':[fM2**3,3*uM2],'M2^4':[fM2**4,4*uM2],Mm:[fMm,0],Mf:[fMf,uMf]};

const TIDE_MIX = { YR: [['GB',0.5],['H1',0.5]] }; // 由良推定＝御坊と下津の平均
function tideHas(stn){ return !!(TIDE_CONS.out[stn] || TIDE_MIX[stn]); }
function tideHeight(stn, ms){ // ms: UTCミリ秒 → 潮位(cm)
  if(TIDE_MIX[stn]) return TIDE_MIX[stn].reduce((a,[k,w])=>a+w*tideHeight(k,ms),0);
  const st=TIDE_CONS.out[stn]; if(!st) return null;
  const R=Math.PI/180, T=(ms/86400000+2440587.5-2451545.0)/36525;
  const s=218.3165+481267.8813*T, h=280.4661+36000.7698*T, p=83.3535+4069.0137*T, N=125.0445-1934.1363*T, p1=282.9384+1.7195*T;
  const ut=((ms/3600000)%24+24)%24, tau=15*ut+180+h-s, nf=tideNodal(N);
  let z=st[0];
  TIDE_CONS.names.forEach((k,i)=>{ const q=TIDE_DEF[k], [H,g]=st[1][i]; if(!H) return;

function tideExtremes(stn, ds){ // ds:'YYYY-MM-DD'（日本時間）→ {high:[{t,cm}], low:[...]}
  if(!tideHas(stn)) return null;
  const [y,m,d]=ds.split('-').map(Number), step=120000;
  const t0=Date.UTC(y,m-1,d,-9,0)-6*3600000; // 前後に余裕を持って計算

  let changed=true;
  while(changed){ changed=false;
    for(let i=0;i<ex.length-1;i++){ if(Math.abs(ex[i].cm-ex[i+1].cm)<5){ ex.splice(i,2); changed=true; break; } }

  return out;
}


function tideTimesStr(tt, short){
  if(!tt) return '';
  const f = a => (a||[]).map(x=> short ? x.t : `${x.t}(${x.cm}cm)`).join('・');
  return short ? `満 ${f(tt.high)} / 干 ${f(tt.low)}` : `満潮 ${f(tt.high)}　干潮 ${f(tt.low)}　〔${stnName(tt.stn)}〕`;
}
function tideChartSVG(t, o={}){
  const stn = (t.tideTimes&&t.tideTimes.stn) || db.tideStn[t.place] || '';
  if(!t.date || !stn || !tideHas(stn)) return '';
  const fs=o.fs||11, W=o.w||600, H=o.h||200, L=fs*3.2, R=fs*1.3, Tp=fs*1.6, B=fs*1.9;
  const [y,m,d]=t.date.split('-').map(Number), base=Date.UTC(y,m-1,d,-9,0);
  const H0=6, H1=15; // 表示は6時〜15時
  const pts=[]; for(let i=H0*6;i<=H1*6;i++){ pts.push([i/6, tideHeight(stn, base+i*600000)]); }
  let lo=Math.min(...pts.map(p=>p[1])), hi=Math.max(...pts.map(p=>p[1]));
  lo=Math.floor((lo-10)/50)*50; hi=Math.ceil((hi+10)/50)*50;
  const X=h=>L+(W-L-R)*(h-H0)/(H1-H0), Y=v=>Tp+(H-Tp-B)*(hi-v)/(hi-lo);
  const toH=s=>{ const m=String(s||'').match(/^(\d{1,2}):(\d{2})/); return m? +m[1]+(+m[2])/60 : null; };
  let g='';
  const s0=null, e0=null; // 開始・終了時刻は使わない
  if(s0!=null||e0!=null){ const a=s0??0, b=e0??24; g+=`<rect x="${X(a)}" y="${Tp}" width="${Math.max(0,X(b)-X(a))}" height="${H-Tp-B}" fill="#f28c28" opacity=".15"/><text x="${(X(a)+X(b))/2}" y="${Tp+fs}" font-size="${fs}" fill="#a95c0d" text-anchor="middle">釣り時間</text>`; }
  for(let v=lo; v<=hi; v+=50) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#d7e2e8" stroke-width="1"/><text x="${L-4}" y="${Y(v)+fs/3}" font-size="${fs}" fill="#5f7682" text-anchor="end">${v}</text>`;
  for(let h=H0; h<=H1; h++) g+=`<line x1="${X(h)}" x2="${X(h)}" y1="${Tp}" y2="${H-B}" stroke="#d7e2e8" stroke-width="1"/><text x="${X(h)}" y="${H-B+fs+3}" font-size="${fs}" fill="#5f7682" text-anchor="middle">${h}時</text>`;
  const line = pts.map((p,i)=>`${i?'L':'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
  g+=`<path d="${line}L${X(H1)},${H-B}L${X(H0)},${H-B}Z" fill="#0b4f6c" opacity=".12"/><path d="${line}" fill="none" stroke="#0b4f6c" stroke-width="2"/>`;
  const ex = tideExtremes(stn, t.date);
  for(const [arr,col,dy] of [[ex.high,'#c0392b',-6],[ex.low,'#1f6fb2',fs+6]]) for(const e of arr){ const h=toH(e.t); if(h==null || h<H0 || h>H1) continue;
    const yy=Y(e.cm); g+=`<circle cx="${X(h)}" cy="${yy}" r="3.5" fill="${col}"/><text x="${Math.min(Math.max(X(h),L+24),W-R-24)}" y="${Math.min(Math.max(yy+dy,Tp+fs),H-B-3)}" font-size="${fs}" fill="${col}" text-anchor="middle" font-weight="700">${e.t} ${e.cm}</text>`; }
  g+=`<text x="${L}" y="${Tp-4}" font-size="${fs}" fill="#17323f">潮位(cm) 6〜15時〔${esc(stnName(stn))}〕${esc(t.tide||'')}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:${W}px" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">${g}</svg>`;
}
function updateTideChart(t){ const el=document.getElementById('tideChart'); if(el && draft===t) el.innerHTML = tideChartSVG(t,{w:600,h:260,fs:17}); }

async function fetchTide(t, manual){
  const stn = db.tideStn[t.place]||'';
  const box = document.getElementById('tideTimes');
  const show = msg => { if(box && draft===t) box.innerHTML = msg; };
  if(!t.date) return;
  if(!stn){ if(manual) toast('この釣り場には観測地点が設定されていません（設定で選べます）'); show(t.tideTimes?esc(tideTimesStr(t.tideTimes)):'<span class="muted">観測地点が未設定の釣り場です</span>'); return; }
  if(!manual && t.tideTimes && t.tideTimes.stn===stn && t.tideTimes.date===t.date) return;
  try{
    const r = tideExtremes(stn, t.date); // アプリ内で計算（通信なし）
    if(!r) throw new Error('この観測地点は計算できません');
    t.tideTimes = r; show(esc(tideTimesStr(t.tideTimes))); updateTideChart(t);
  }catch(e){ show(`<span class="muted">計算できませんでした（${esc(e.message||'')}）</span>`); }
}

/* 集計補助 */
function seatPos(t,p){ return (t.seats||{})[p] || (p===db.me && !(t.rafts||{})[p] ? (t.ikada||'') : ''); }
function seatOf(t,p){ // 印刷・CSV用：「紀州A-東南」「チヌ7・8」の形
  const r=(t.rafts||{})[p]||'', s=seatPos(t,p);
  if(!r) return s; if(!s) return r;
  return /^[0-9０-９]/.test(s) ? r+s : r+'-'+s;
}
function orderMembers(t){ const ms=tripMembers(t); return ms.includes(db.me) ? [db.me, ...ms.filter(p=>p!==db.me)] : ms; }
function tripMembers(t){ const ms = t.members && t.members.length ? t.members.slice() : [db.me]; return ms; }
function personTotal(t,p){ const c=(t.counts||{})[p]||{}; return Object.values(c).reduce((a,b)=>a+(+b||0),0); }
function tripTotal(t){ return Object.keys(t.counts||{}).reduce((a,p)=>a+personTotal(t,p),0); }
function tripFishTotals(t){
  const r={}; for(const p in (t.counts||{})) for(const f in t.counts[p]){ const n=+t.counts[p][f]||0; if(n) r[f]=(r[f]||0)+n; }
  return r;
}

function saveDraft(){

  for(const p in t.counts){ if(!t.members.includes(p) || !Object.keys(t.counts[p]).length) delete t.counts[p]; }
  const rec = Object.assign({}, t); delete rec.isNew; rec.updatedAt = Date.now();
  const i = db.trips.findIndex(x=>x.id===rec.id);
  if(i>=0){ (db.trips[i].photos||[]).filter(id=>!(rec.photos||[]).includes(id)).forEach(photoDel); db.trips[i]=rec; } else db.trips.push(rec);
  if(rec.place && !db.places.includes(rec.place)) db.places.push(rec.place);

  if(tripMembers(rec).includes(db.me)) showReaction(personTotal(rec, db.me)); else toast('保存しました');
}

function fishStr(c){ return Object.entries(c||{}).filter(([,n])=>+n>0).sort((a,b)=>b[1]-a[1]).map(([f,n])=>`${esc(f)} ${n}`).join('、'); }
function yearLabel(y){ // 例：令和8年（2026年）
  const e = y>=2020 ? `令和${y-2018}年` : y===2019 ? '平成31年・令和元年' : y>=1989 ? `平成${y-1988===1?'元':y-1988}年` : `昭和${y-1925}年`;
  return `${e}（${y}年）`;
}
function eraLabel(ds){ return dotDate(ds).split('.')[0]; } // 例：R8、H29
function dotDate(ds){ // 和暦の頭文字で表示：R8.10.31
  const [y,m,d]=ds.split('-').map(Number), v=y*10000+m*100+d;
  const era = v>=20190501 ? ['R',y-2018] : v>=19890108 ? ['H',y-1988] : v>=19261225 ? ['S',y-1925] : ['',y];
  return `${era[0]}${era[1]}.${m}.${d}`;
}
function runningAvg(t){ // 同じ年・同じ釣堀で、この釣行までの自分の総数 ÷ 釣行回数
  const y=(t.date||'').slice(0,4);
  const same=db.trips.filter(x=>(x.date||'').slice(0,4)===y && (x.place||'')===(t.place||'') && (x.date+(x.start||''))<=(t.date+(t.start||'')) && tripMembers(x).includes(db.me));
  if(!same.length) return null;
  return same.reduce((a,x)=>a+personTotal(x,db.me),0)/same.length;
}

    for(const k of [].concat(keyFn(t))){ if(k==null || k==='') continue;
    const o = g[k] = g[k] || {trips:0, fish:0, rods:0, mine:0};
    o.trips++; o.fish += tripTotal(t); o.rods += tripMembers(t).length; o.mine += personTotal(t, db.me); }
  }
  let keys = Object.keys(g);
  keys = order ? order.filter(k=>g[k]).concat(keys.filter(k=>!order.includes(k))) : keys.sort();
  title += `（${esc(db.me)}）`;
  if(!keys.length) return `<div class="card"><h2>${title}</h2><div class="muted">データがありません</div></div>`;
  const max = Math.max(...keys.map(k=>g[k].mine/g[k].trips));
  return `<div class="card"><h2>${title}</h2><table>
    <tr><th></th><th class="n">釣行</th><th class="n">総数</th><th class="n">平均/回</th><th style="width:35%"></th></tr>
    ${keys.map(k=>{ const o=g[k], avg=o.mine/o.trips; return `<tr><td>${esc(k)}</td><td class="n">${o.trips}</td><td class="n">${o.mine}</td><td class="n"><b style="color:var(--acc)">${round1(avg)}</b></td>
      <td><div class="bar" style="width:${max?avg/max*100:0}%"></div></td></tr>`; }).join('')}
  </table></div>`;
}
function tempBand(v){
  if(v===''||v==null||isNaN(+v)) return null;
  const x=+v; if(x<14) return '〜14℃'; if(x>=26) return '26℃〜';
  const lo = Math.floor(x/2)*2; return `${lo}〜${lo+2}℃`;
}
function renderStats(){

function toCSV(){
  const head = ['日付','曜日','釣り場','自分の釣座','潮','満潮','干潮','水温','天気','風','参加人数','名前','イカダ名','番号・方位','魚種','匹数','当たりエサ','メモ'];
  const rows = [head];
  for(const t of db.trips.slice().sort((a,b)=>a.date.localeCompare(b.date))){
    const base = [t.date, wday(t.date), t.place, seatOf(t,db.me), t.tide, ((t.tideTimes||{}).high||[]).map(x=>x.t).join('・'), ((t.tideTimes||{}).low||[]).map(x=>x.t).join('・'), t.waterTemp, t.weather, t.wind, tripMembers(t).length];
    let any=false;
    for(const p of tripMembers(t)){
      const c=(t.counts||{})[p]||{};
      const ent=Object.entries(c).filter(([,n])=>+n>0);
      if(!ent.length){ rows.push([...base,p,(t.rafts||{})[p]||'',seatPos(t,p),'',0,(t.baits||[]).join('・'),t.memo]); any=true; continue; }
      for(const [f,n] of ent){ rows.push([...base,p,(t.rafts||{})[p]||'',seatPos(t,p),f,n,(t.baits||[]).join('・'),t.memo]); any=true; }
    }
    if(!any) rows.push([...base,'','','','',0,(t.baits||[]).join('・'),t.memo]);
  }
  return rows.map(r=>r.map(v=>{ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\r\n');
}

function exportText(title, text, fname, mime){
  // ファイル保存（GitHub Pages等では動作）。保存できない画面でもコピーで持ち出せるようにする
  let saved=false;
  try{
    const blob = new Blob([mime==='text/csv'?'﻿'+text:text], {type:mime+';charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove(); saved=true;
  }catch(e){}
  openModal(`<h2 style="font-size:16px;margin:0 0 6px">${esc(title)}</h2>
    <div class="muted" style="margin-bottom:8px">${saved?`「${esc(fname)}」の保存を開始しました。保存されない場合は下の「コピー」を使ってメモ帳などに貼り付けてください。`:'下の「コピー」でコピーして、メモ帳などに貼り付けて保存してください。'}</div>

    <div class="row" style="margin-top:10px"><button class="btn sub" id="expClose">閉じる</button><button class="btn" id="expCopy">📋 コピー</button></div>`);

  $('#expCopy').onclick=async()=>{

  };
}

const META_KEY = 'tsuribori-note-share-meta';
function getMeta(){ try{ return JSON.parse(localStorage.getItem(META_KEY))||{}; }catch(e){ return {}; } }
function setMeta(m){ try{ localStorage.setItem(META_KEY, JSON.stringify({...getMeta(), ...m})); }catch(e){} }
function lastSavedText(){
  const m=getMeta();
  if(!m.savedAt) return '⚠ まだファイルに保存していません';
  const d=new Date(m.savedAt);
  return `最後にファイル保存：${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}` + ((m.changedAt||0)>m.savedAt?'（その後に変更あり）':'');
}
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
async function buildDataFile(){
  const out = JSON.parse(JSON.stringify(db)); out.photoData = {}; out.app='kaijou-tsuribori'; out.savedAt=Date.now();
  for(const t of db.trips) for(const id of (t.photos||[])){ const v=await photoGet(id); if(v) out.photoData[id]=v; }

}
async function saveDataFile(){
  toast('保存するデータを準備中…');

  const fname = `釣りログ君_${stamp()}.json`;

  const canShare = !!(file && navigator.canShare && navigator.canShare({files:[file]}));
  const nPh = Object.keys(JSON.parse(text).photoData||{}).length;
  openModal(`<h2 style="font-size:16px;margin:0 0 6px">💾 データを保存</h2>

    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn" id="dfDown">📥 この端末に保存（ダウンロード）</button>

      <button class="btn" id="imMerge">今のデータに合わせる（おすすめ）</button>
      <div class="muted" style="margin-top:-4px">両方の記録を残します。同じ記録は新しく直した方になります。</div>
      <button class="btn ng" id="imReplace">今のデータを消して置き換える</button>
      <div class="muted" style="margin-top:-4px">この端末の記録（${db.trips.length}件）は、読み込むファイルの内容に入れ替わります。</div>
      <button class="btn sub" id="imNo">やめる</button>
    </div>`);
  $('#imNo').onclick=closeModal;
  $('#imMerge').onclick=()=>doImport(d, false);
  $('#imReplace').onclick=e=>{
    if(e.target.dataset.arm!=='1'){ e.target.dataset.arm='1'; e.target.textContent='もう一度押すと置き換えます'; return; }
    doImport(d, true);
  };
}
async function doImport(raw, replace){
  const photos = raw.photoData||{};
  const d = normalize(JSON.parse(JSON.stringify({...raw, photoData:undefined})));
  for(const t of d.trips) if(!t.id) t.id=uid();
  if(replace){
    db = normalize(JSON.parse(JSON.stringify(d)));
    db.listsAt = Date.now();
    db.trips.forEach(t=>t.updatedAt=Date.now());
    db.deleted = {};
  } else {
    db = mergeDb(db, d);
    for(const k of ['fish','baits','places','people']) for(const v of d[k]) if(!db[k].includes(v)) db[k].push(v);
    db.tideStn = {...(d.tideStn||{}), ...(db.tideStn||{})};
  }
  delete db.photoData; delete db.app; delete db.savedAt;
  toast('写真を取り込み中…');
  for(const [id,v] of Object.entries(photos)){ try{ await photoPut(id,v); }catch(e){} }
  save(); closeModal(); toast(`読み込みました（釣行 ${d.trips.length}件）`); go('print');
}

// インストール（ホーム画面にアプリとして追加）とオフライン用
lastListsSig = listsSig(db);
// 起動時は必ずトップ（釣果記録）から
try{ history.scrollRestoration='manual'; }catch(e){}
if(location.hash) try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
window.scrollTo(0,0);
function backToTop(){
  if(view==='print' && !$('#modal').classList.contains('show')){ window.scrollTo(0,0); return; }
  closeModal(); go('print');
}
// アプリを閉じてしばらくしてから開き直した時も、トップに戻す（入力途中の記録は残す）
let hiddenAt = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ hiddenAt = Date.now(); return; }
  if(hiddenAt && Date.now()-hiddenAt > 3*60*1000) backToTop();
  hiddenAt = 0;
});
window.addEventListener('pageshow', e=>{ if(e.persisted) backToTop(); });
try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
render();
// はじめて開いたときに名前を聞く
if(!db.named && !db.trips.length){
  openModal(`<h2 style="font-size:16px;margin:0 0 6px">🎣 ようこそ</h2>
    <div class="muted" style="margin-bottom:10px">あなたの名前（釣果表に出る名前）を入れてください。あとで「設定」から変えられます。</div>
    <input id="firstName" placeholder="例：たろう">
    <div class="row" style="margin-top:12px"><button class="btn sub" id="firstSkip">あとで</button><button class="btn" id="firstOk">はじめる</button></div>`);
  const fin = v=>{ if(v){ db.people=db.people.filter(p=>p!==v); db.me=v; } db.named=true; save(); closeModal(); render(); charaPicker(null, true); };
  $('#firstOk').onclick=()=>fin($('#firstName').value.trim());
  $('#firstSkip').onclick=()=>fin('');
}
</script>
